name: Test template
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose --profile test run --build --rm smoke
      - run: docker compose restart catalog
      - run: docker compose up -d --wait --wait-timeout 300
      - run: docker compose --profile test run --rm smoke
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
